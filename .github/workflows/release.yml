name: Release

# Push a tag such as v0.1.0. The tag sets the app version, in place of MARKETING_VERSION in project.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # A temporary keychain, set as default, so codesign finds the certificate and
      # notarytool stores and finds the kartka-notary profile without extra flags.
      - name: Set up signing keychain
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          certificate="$RUNNER_TEMP/developer-id.p12"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$certificate" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          # A signing identity is a certificate with its private key. A .p12 without the key gives 0.
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::DEVELOPER_ID_P12 has no Developer ID Application certificate with its private key"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm "$certificate"

          xcrun notarytool store-credentials kartka-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id JYDM4GTWRT --password "$NOTARY_PASSWORD"

      - name: Build, notarize and zip
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls build/Kartka-*.zip)
          sha=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "Kartka ${GITHUB_REF_NAME#v}" \
            --notes "SHA-256: \`$sha\`"

      # Points the Nix package at this release on main. The tag checkout is a detached
      # HEAD, so the step switches to main first; build output is ignored by git.
      - name: Update Nix package
        run: |
          version="${GITHUB_REF_NAME#v}"
          hash="sha256-$(openssl dgst -sha256 -binary "build/Kartka-$version.zip" | base64)"

          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          sed -i '' \
            -e "s|version = \".*\";|version = \"$version\";|" \
            -e "s|hash = \"sha256-.*\";|hash = \"$hash\";|" \
            nix/package.nix

          if git diff --quiet nix/package.nix; then
            echo "nix/package.nix already points at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "nix: update kartka to $version" nix/package.nix
          git push origin main

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
