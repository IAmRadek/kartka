name: Kartka
options:
  bundleIdPrefix: com.struct0x
  deploymentTarget:
    macOS: "14.0"
targets:
  Kartka:
    type: application
    platform: macOS
    sources:
      - Kartka
      # The command line script ships inside the app, at Contents/Resources/kartka.
      - path: bin/kartka
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Kartka
        PRODUCT_BUNDLE_IDENTIFIER: com.struct0x.kartka
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # "Sign to Run Locally": ad-hoc signature, no team.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release builds are signed for distribution outside the App Store and notarized.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: JYDM4GTWRT
    info:
      path: Kartka/Info.plist
      properties:
        CFBundleDisplayName: Kartka
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).KartkaDocument
            LSItemContentTypes:
              - public.plain-text
              - public.utf8-plain-text
              - net.daringfireball.markdown
              - public.json
              - public.yaml
              - public.source-code
              - public.data
    entitlements:
      path: Kartka/Kartka.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
